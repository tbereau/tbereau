# Which publications belong to which section of `research_topics.qmd`.
#
# The page used to select papers per section either by coauthor
# (`authors.includes("Roberto Menichetti")`) or by a list of DOIs written into
# the page itself. Both drift. A coauthor filter silently adopts whatever that
# person publishes next, whether or not it belongs to the topic, and a DOI list
# has to be extended by hand every time a paper comes out. Between them, 44 of
# 89 publications had ended up in no section at all and the page's most recent
# entry was from 2022.
#
# The assignment lives here instead, and `scripts/topics.py` joins it onto
# `data/all_papers.json` as a `topics` field, warning about any DOI it cannot
# find and about any paper left unassigned. A paper may carry more than one
# topic; the order below is also the order the sections appear on the page.
#
# After editing, run:  poetry run python scripts/topics.py

