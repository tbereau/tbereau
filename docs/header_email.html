<script>
    // The address is assembled here rather than written into contact.qmd so it
    // does not sit in the served HTML as a harvestable mailto:. The `<span>`
    // ships with a no-JS fallback inside it ("bereau *at* ..."), which this
    // replaces; without the fallback the @ icon labelled nothing at all
    // whenever scripting was off or the script failed to load.
    document.addEventListener('DOMContentLoaded', function () {
        var user = 'bereau';
        var domain = 'thphys.uni-heidelberg.de';
        var email = user + '@' + domain;
        var emailPlaceholder = document.getElementById('email-placeholder');

        if (emailPlaceholder) {
            var link = document.createElement('a');
            link.href = 'mailto:' + email;
            link.textContent = email;
            emailPlaceholder.replaceChildren(link);
        }
    });
</script>
