[tool.poetry]
name = "tristanbereau_website"
version = "0.1.0"
description = ""
authors = ["Tristan Bereau <bereau@thphys.uni-heidelberg.de>"]
readme = "README.rst"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
isort = "^5.12.0"
jupyter = "^1.0.0"
nltk = "^3.8.1"
pandas = "^2.0.3"
pydantic = "^2.0"
unidecode = "^1.3.6"
pyhumps = "^3.8.0"
python-decouple = "^3.8"
xmltodict = "^0.13.0"
pymongo = "^4.4.0"
plotly = "^5.15.0"
bokeh = "^3.2.0"
lunr = "^0.6.2"
boto3 = "^1.26.165"
llvmlite = "^0.40.1"
numba = "^0.57.1"
bertopic = "^0.15.0"
# Transitive via sentence-transformers, but constrained here: transformers
# 4.56+ needs a newer torch than the 2.1.x that my_scientific_profile's
# typing-extensions pin allows, and declares torch optional so the resolver
# cannot see the conflict.
transformers = ">=4.55,<4.56"
scikit-learn = "1.2.2"
numpy = "1.24.0"
setuptools = "^68.0.0"
nbformat = "^5.9.0"
typing-extensions = "4.6.3"
my_scientific_profile = {git = "git@github.com:tbereau/my_scientific_profile.git", tag="v0.2.0"}
python-dotenv = "^1.0.0"
# Reads data/topics.yml in scripts/topics.py. Already present transitively,
# but the scripts import it directly.
pyyaml = "^6.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
